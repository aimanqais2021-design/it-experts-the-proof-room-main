version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ite_proof_room_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itexperts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itexperts_secure_db_pw}
      POSTGRES_DB: ${POSTGRES_DB:-itexperts_proof_room}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-itexperts} -d $${POSTGRES_DB:-itexperts_proof_room}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ite_proof_room_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-itexperts}:${POSTGRES_PASSWORD:-itexperts_secure_db_pw}@postgres:5432/${POSTGRES_DB:-itexperts_proof_room}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_64_char_production_secret_key}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@itexperts.dev}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-ChangeMeInProduction2026!}
    volumes:
      - ./evidence:/evidence:ro
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ite_proof_room_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
