name: IT EXPERTS Proof Room CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-evidence-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend & Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pillow

      - name: Validate 12 Project Evidence Bundles & SHA-256 Checksums
        run: python scripts/validate_projects.py

      - name: Run Backend Pytest Suite
        run: pytest backend/tests/test_api.py -v

  frontend-build-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Strict Verification
        working-directory: ./frontend
        run: npm run typecheck

      - name: Production Vite Bundle Build
        working-directory: ./frontend
        run: npm run build
